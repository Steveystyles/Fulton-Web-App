name: Build

on:
  push:
    branches:
      - main
      - beta/daily-map-game
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run server tests
        run: npm run test:server

      - name: Build production container
        run: docker build -t fultons-quiz:test .

      - name: Verify production Python imports
        run: >-
          docker run --rm --entrypoint python fultons-quiz:test -c
          "import server; from tools import generate_map_place_candidates_with_ai,
          install_map_training_seed, map_clue_quality_model"
