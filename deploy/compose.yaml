services:
  quiz-app:
    image: ${FULTONS_IMAGE:?Set FULTONS_IMAGE to an immutable image digest}
    container_name: fultons-quiz
    pull_policy: never
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ${FULTONS_ENV_FILE:-/srv/storage/appdata/fultons-quiz/app.env}
    environment:
      FULTONS_HOST: 0.0.0.0
      FULTONS_PORT: 3000
      FULTONS_TIMEZONE: Europe/London
      # The external proxy network on this host is 172.18.0.0/16. Only peers
      # inside that explicit boundary may supply the client IP used by throttles/audits.
      FULTONS_TRUST_PROXY_HEADERS: "1"
      FULTONS_TRUSTED_PROXY_CIDRS: 172.18.0.0/16
    volumes:
      - ${FULTONS_HOST_DATA_DIR:-/srv/storage/appdata/fultons-quiz}:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)); raise SystemExit(0 if data.get('ok') else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.fultons-quiz.rule=Host(`fultons-quiz.co.uk`) || Host(`www.fultons-quiz.co.uk`)"
      - "traefik.http.routers.fultons-quiz.entrypoints=websecure"
      - "traefik.http.routers.fultons-quiz.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fultons-quiz.middlewares=fultons-quiz-compress"
      - "traefik.http.middlewares.fultons-quiz-compress.compress=true"
      - "traefik.http.services.fultons-quiz.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: proxy
  app:
    internal: true
