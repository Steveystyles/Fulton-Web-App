services:
  promo-test:
    image: nginx:1.27-alpine
    container_name: fultons-promo-test
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ${FULTONS_PROMO_DIST_DIR:?Set FULTONS_PROMO_DIST_DIR}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.fultons-promo-test.rule=Host(`test.fultons-quiz.com`) || Host(`test.fultons-quiz.co.uk`) || Host(`${FULTONS_PROMO_FALLBACK_HOST:-fultons-promo.81-102-195-20.sslip.io}`)"
      - "traefik.http.routers.fultons-promo-test.entrypoints=websecure"
      - "traefik.http.routers.fultons-promo-test.tls.certresolver=letsencrypt"
      - "traefik.http.services.fultons-promo-test.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: proxy
