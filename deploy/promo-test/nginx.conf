server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/logout {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location = /api/auth/me {
        proxy_pass http://fultons-quiz:3000;
        proxy_set_header Host "fultons-quiz.co.uk";
        proxy_set_header Origin "https://fultons-quiz.co.uk";
        proxy_set_header Cookie "fultons_session=${FULTONS_PROMO_GUEST_SESSION}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_hide_header Set-Cookie;
    }

    location = /api/daily-map-game {
        proxy_pass http://fultons-quiz:3000;
        proxy_set_header Host "fultons-quiz.co.uk";
        proxy_set_header Origin "https://fultons-quiz.co.uk";
        proxy_set_header Cookie "fultons_session=${FULTONS_PROMO_GUEST_SESSION}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_hide_header Set-Cookie;
    }

    location ~ ^/api/daily-map-game/[0-9]+/(snap|guess)$ {
        proxy_pass http://fultons-quiz:3000;
        proxy_set_header Host "fultons-quiz.co.uk";
        proxy_set_header Origin "https://fultons-quiz.co.uk";
        proxy_set_header Cookie "fultons_session=${FULTONS_PROMO_GUEST_SESSION}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_hide_header Set-Cookie;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"This endpoint is not available in guest review mode."}';
    }

    location /videos/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges "bytes";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
